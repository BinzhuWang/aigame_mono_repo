[package]
name = "aigame-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-files = "0.6.6"
actix-multipart = "0.7.2"
actix-proxy = "0.2.0"
actix-web = "4.10.2"
actix-web-lab = "0.24.1"
anyhow = "1.0.97"
awc = "3.7.0"
chrono = "0.4.40"
dotenvy = "0.15.7"
ffprobe = "0.4.0"
futures-util = "0.3.31"
image = "0.25.5"
jsonwebtoken = "9.3.1"
rabbitmq-stream-client = "0.8.0"
regex = "1.11.1"
reqwest = { version = "0.12.15", features = ["json"] }
rodio = "0.20.1"
sea-orm = { version = "1.1.7", features = ["sqlx-mysql", "runtime-tokio"] }
serde = "1.0.219"
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["time"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["v4"] }


[profile.fast]
inherits = "release"
opt-level=3
lto = "fat"
codegen-units = 1
panic= "abort"

[profile.tiny]
inherits = "release"
opt-level= 'z'
lto = true
codegen-units = 1
panic= "abort"
strip = "symbols"
